# Copy to rooms.settings.yaml (gitignored) or run: python cli.py config init
# API keys belong in .env (see .env.example), not in this file.

defaults:
  litellm_model: "ollama/gemma4:e2b"
  orchestrator_model: "ollama/gemma4:e2b"
  temperature: 0.7
  timeout: 30

presets:
  local-ollama:
    litellm_model: "ollama/gemma4:e2b"
  openai:
    litellm_model: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"

ollama:
  auto_select_first: false
  base_url: "http://localhost:11434"

user:
  name: "User"
  background: ""

# true = use built-in Elena / Viktor / Nyx personas (prompts from repo)
use_shipped_personas: true

# Optional: override personas entirely (set use_shipped_personas: false)
